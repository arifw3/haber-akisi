name: Günlük bülten

on:
  schedule:
    # Her gün 06:00 (TR) — UTC 03:00
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bulletin
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Feed sağlığını kontrol et
        run: python -m mynews health

      - name: Bağımlılıkları kur
        run: pip install -q -r requirements.txt

      - name: Ses önbelleğini geri yükle
        uses: actions/cache@v4
        with:
          path: site/audio/cache
          key: tts-cache-${{ github.run_id }}
          restore-keys: tts-cache-

      - name: Bülteni üret
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_DOC_ID: ${{ secrets.GOOGLE_DOC_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python -m mynews build --with-audio --sync-doc

      - name: Testleri çalıştır
        run: python -m unittest discover -s tests -v

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
