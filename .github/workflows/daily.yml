name: Günlük bülten

on:
  schedule:
    # Her gün 06:00 (TR) — UTC 03:00
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bulletin
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Stiller derlenir; tarayıcıda derlenmez. Bu adım olmazsa app.js'e
      # eklenen yeni bir Tailwind sınıfı sessizce stilsiz kalırdı — depoya
      # işlenmiş styles.css o sınıfı tanımıyor olurdu.
      - name: Stilleri derle
        run: npx --yes tailwindcss@3.4.17 -c tailwind.config.js -i tailwind.input.css -o site/styles.css --minify

      - name: Feed sağlığını kontrol et
        run: python -m mynews --locale tr health

      - name: Önbelleği ve geçmişi geri yükle
        uses: actions/cache@v6
        with:
          # Ses önbelleği, yayınlanmış bölümler, podcast arşivi, çeviri
          # önbelleği ve günler arası tekrar elemesi için haber geçmişi.
          #
          # Çeviri önbelleği burada olmazsa her çalışma aynı başlıkları
          # yeniden çevirir; bu Gemini'nin günlük kotasını boşa yakar ve
          # sıradaki podcast adımı 429 alır (10 Eylül'de tam olarak bu oldu).
          path: |
            site/audio/cache
            site/audio/episodes
            site/data/tr/episodes.json
            site/data/en/episodes.json
            site/data/tr/podcast-*.json
            site/data/en/podcast-*.json
            data/translations.json
            data/history-tr.json
            data/history-en.json
          key: mynews-state-${{ github.run_id }}
          restore-keys: mynews-state-

      - name: Bülteni üret
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Podcast senaryosu Gemini kotası harcar. Her push'ta yeni bölüm
          # üretmek hem gereksiz (haberler değişmedi) hem de günlük kotayı
          # bitirip asıl sabah çalışmasını podcastsiz bırakıyor. Kod
          # değişikliğinde site yine güncellenir, podcast bir öncekinden kalır.
          PODCAST: ${{ github.event_name == 'push' && ' ' || '--podcast' }}
        run: |
          # Diller sırayla üretilir: Pages tek artifact aldığı için ayrı
          # işlere bölünemez, ikincisi birincisini ezerdi.
          for locale in tr en; do
            echo "::group::$locale"
            python -m mynews --locale "$locale" build --with-audio $PODCAST
            echo "::endgroup::"
          done

      - name: Testleri çalıştır
        run: python -m unittest discover -s tests -v

      - name: Bülteni denetle (rapor)
        # Rapor amaçlı: burada durursa site hiç yayınlanmaz.
        # Asıl uyarı, dağıtımdan sonraki health işinden gelir.
        continue-on-error: true
        run: python -m mynews --locale tr doctor

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Yayınlanan sonucu denetler. Ayrı iş ve if:always() olmasının sebebi:
  # denetim başarısız olsa bile site yayınlanmış olmalı. Podcast üretilemedi
  # diye sitenin hiç güncellenmemesi, eksik podcast'ten daha kötü olurdu.
  health:
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Pages dağıtımının yayılmasını bekle
        run: sleep 60

      - name: Yayınlanan bülteni denetle
        # Podcast denetimi push çalışmalarında da açık. Günün bölümü sabahki
        # zamanlanmış çalışmada üretiliyor; push'ta yeniden üretilmese de
        # taşınıyor olmalı. Burada kırmızı yanması "taşıma bozuldu" demek —
        # tam da bilmek istediğimiz şey. Denetimi susturarak yeşile boyamak,
        # sistemin kendi başarısını yanlış ölçmesine geri dönmek olurdu.
        #
        # Her dil ayrı denetlenir. Eskiden yalnızca varsayılan dil (tr)
        # denetleniyordu; İngilizce bülten bozulsa Actions bunu hiç göstermezdi.
        # Biri düşse de diğeri denetlenir, sonuçta herhangi bir hata kırmızıdır.
        run: |
          status=0
          for locale in tr en; do
            echo "::group::$locale"
            python -m mynews --locale "$locale" doctor --url https://arifw3.github.io/haber-akisi || status=1
            echo "::endgroup::"
          done
          exit $status

  # GitHub, 60 gün boyunca commit almayan herkese açık depolarda zamanlanmış
  # iş akışlarını kendiliğinden kapatır. Bülten depoya işlenmediği için
  # bu depo kendi başına hiç commit üretmez: 2026-11-11'de tam 60. günde
  # kapandı ve site iki gün sessizce eskidi.
  #
  # İş akışını API üzerinden yeniden etkinleştirmek hareketsizlik sayacını
  # sıfırlar; boş "canlı tut" commit'leriyle geçmişi kirletmeye gerek kalmaz.
  # Ayrı iş olmasının sebebi: bülten üretimi düşse bile bu adım çalışmalı,
  # ve gereken actions:write yetkisi yalnızca burada verilmeli.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: İş akışını etkin tut
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily.yml/enable"
