name: Günlük bülten

on:
  schedule:
    # Her gün 06:00 (TR) — UTC 03:00
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bulletin
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Feed sağlığını kontrol et
        run: python -m mynews health

      - name: Önbelleği ve geçmişi geri yükle
        uses: actions/cache@v4
        with:
          # Ses önbelleği, yayınlanmış bölümler, podcast arşivi ve
          # günler arası tekrar elemesi için görülen haber geçmişi.
          path: |
            site/audio/cache
            site/audio/episodes
            site/data/episodes.json
            data/history.json
          key: mynews-state-${{ github.run_id }}
          restore-keys: mynews-state-

      - name: Bülteni üret
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m mynews build --with-audio --podcast

      - name: Testleri çalıştır
        run: python -m unittest discover -s tests -v

      - name: Bülteni denetle (rapor)
        # Rapor amaçlı: burada durursa site hiç yayınlanmaz.
        # Asıl uyarı, dağıtımdan sonraki health işinden gelir.
        continue-on-error: true
        run: python -m mynews doctor

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Yayınlanan sonucu denetler. Ayrı iş ve if:always() olmasının sebebi:
  # denetim başarısız olsa bile site yayınlanmış olmalı. Podcast üretilemedi
  # diye sitenin hiç güncellenmemesi, eksik podcast'ten daha kötü olurdu.
  health:
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pages dağıtımının yayılmasını bekle
        run: sleep 60

      - name: Yayınlanan bülteni denetle
        run: python -m mynews doctor --url https://arifw3.github.io/haber-akisi
