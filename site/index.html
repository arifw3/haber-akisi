<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haber Akışı</title>
<meta name="description" content="Google Haberler'den günlük Türkçe haber bülteni — okuyun ya da hands-free dinleyin">
<meta name="theme-color" content="#fdeef4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Haber Akışı">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        /* Sıcak nötrler: gri yerine pembeye çalan koyu tonlar */
        ink:   { DEFAULT: "#2a1020", soft: "#7b5164", faint: "#b189a0" },
        brand: { 50:"#fff0f6", 100:"#ffe0ec", 200:"#ffc4dc", 500:"#f0508f", 600:"#d81b60", 700:"#ab134b" },
        shell: "#fdeef4"
      },
      fontFamily: {
        sans: ["Inter", "system-ui", "-apple-system", "Segoe UI", "Roboto", "sans-serif"]
      },
      boxShadow: {
        hero: "0 22px 44px -20px rgba(120,18,60,.42)",
        card: "0 10px 30px -18px rgba(120,18,60,.24)",
        nav:  "0 -4px 30px -12px rgba(120,18,60,.16)",
        pill: "0 10px 22px -10px rgba(216,27,96,.55)"
      },
      borderRadius: { xl2: "1.5rem", xl3: "2rem" }
    }
  }
}
</script>
<style>
  html { overscroll-behavior-y: none; }
  body { overflow-x: hidden; }   /* yatay taşmayı kes, dikey kaydırma serbest kalsın */
  body {
    background:
      radial-gradient(120% 70% at 50% -8%, #ffd9e8 0%, #fde7f0 38%, #fdeef4 72%, #fdf4f7 100%)
      fixed;
  }
  * { min-width: 0; }

  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

  .snap-x-mandatory { scroll-snap-type: x mandatory; }

  /* Temanın imzası: pembeden fuşyaya geçen dolgu (buton, aktif sekme, chip) */
  .grad { background-image: linear-gradient(100deg, #f4728c 0%, #e2459a 52%, #d0269c 100%); }

  /* Haber görseli yok (RSS vermiyor): kategoriye göre gradient + ince doku */
  .hero-tex::after {
    content: "";
    position: absolute; inset: 0;
    background-image:
      radial-gradient(circle at 18% 22%, rgba(255,255,255,.16) 0, transparent 42%),
      radial-gradient(circle at 82% 78%, rgba(0,0,0,.22) 0, transparent 55%);
    pointer-events: none;
  }

  .view { animation: fade .28s ease both; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  @keyframes eq { 0%,100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
  .eq span { display:block; width:3px; height:14px; border-radius:2px; background:currentColor;
             transform-origin:center bottom; animation: eq .9s ease-in-out infinite; }
  .eq span:nth-child(2){ animation-delay:.15s }
  .eq span:nth-child(3){ animation-delay:.3s }

  @media (prefers-reduced-motion: reduce) { .view, .eq span { animation: none; } }
</style>
</head>
<body class="min-h-screen font-sans text-ink antialiased">

<div class="mx-auto flex min-h-screen w-full max-w-md flex-col">
  <header id="topbar" class="sticky top-0 z-40 bg-[#fdeef4]/80 px-5 pb-2 pt-[max(0.9rem,env(safe-area-inset-top))] backdrop-blur-xl"></header>
  <main id="view" class="flex-1 px-5 pb-44"></main>
</div>

<!-- Hands-free mini oynatıcı -->
<div id="mini" class="pointer-events-none fixed inset-x-0 bottom-[5.6rem] z-40 hidden px-5">
  <div class="pointer-events-auto mx-auto flex max-w-md items-center gap-3 rounded-xl2 bg-gradient-to-r from-[#3d0f24] to-[#6d1440] px-3 py-2.5 text-white shadow-hero">
    <button id="mini-toggle" class="grid h-11 w-11 shrink-0 place-items-center rounded-full bg-white/15 transition active:scale-95" aria-label="Duraklat">
      <svg id="mini-pause" class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24"><path d="M7 5h3.2v14H7zM13.8 5H17v14h-3.2z"/></svg>
      <svg id="mini-play" class="hidden h-5 w-5 translate-x-[1px]" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>
    </button>
    <div class="min-w-0 flex-1">
      <p id="mini-title" class="truncate text-[13.5px] font-semibold leading-tight">—</p>
      <p id="mini-sub" class="truncate text-[12px] text-white/60">—</p>
    </div>
    <div id="mini-eq" class="eq flex shrink-0 items-end gap-[3px] text-brand-200"><span></span><span></span><span></span></div>
    <button id="mini-rate" class="h-9 shrink-0 rounded-full bg-white/10 px-2.5 text-[12.5px] font-bold tabular-nums transition active:scale-95" aria-label="Oynatma hızı">1×</button>
    <button id="mini-next" class="grid h-10 w-10 shrink-0 place-items-center rounded-full bg-white/10 transition active:scale-95" aria-label="Sonraki">
      <svg class="h-[18px] w-[18px]" fill="currentColor" viewBox="0 0 24 24"><path d="M6 5.5v13l9-6.5zM16.5 5H19v14h-2.5z"/></svg>
    </button>
    <button id="mini-close" class="grid h-10 w-10 shrink-0 place-items-center rounded-full text-white/60 transition active:scale-95" aria-label="Dinlemeyi kapat">
      <svg class="h-[18px] w-[18px]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" stroke-linecap="round"/></svg>
    </button>
  </div>
</div>

<nav class="pointer-events-none fixed inset-x-0 bottom-0 z-50 px-5 pb-[max(.85rem,env(safe-area-inset-bottom))] pt-2">
  <div class="pointer-events-auto mx-auto flex max-w-md items-center justify-between rounded-full bg-white/95 p-2 shadow-nav backdrop-blur-xl">
    <button data-nav="home" class="nav-btn flex items-center gap-2 rounded-full px-4 py-3 transition" aria-label="Ana sayfa">
      <svg class="h-[22px] w-[22px] shrink-0" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24">
        <path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4v-5h-6v5H5a1 1 0 0 1-1-1z" stroke-linejoin="round"/>
      </svg>
      <span class="nav-label hidden text-[14px] font-semibold">Ana sayfa</span>
    </button>
    <button data-nav="discover" class="nav-btn flex items-center gap-2 rounded-full px-4 py-3 transition" aria-label="Keşfet">
      <svg class="h-[22px] w-[22px] shrink-0" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="8.5"/><path d="M15 9l-2.2 4.8L8 16l2.2-4.8z" stroke-linejoin="round"/>
      </svg>
      <span class="nav-label hidden text-[14px] font-semibold">Keşfet</span>
    </button>
    <button data-nav="listen" class="nav-btn flex items-center gap-2 rounded-full px-4 py-3 transition" aria-label="Dinle">
      <svg class="h-[22px] w-[22px] shrink-0" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24">
        <path d="M4 14v-3a8 8 0 0 1 16 0v3" stroke-linecap="round"/>
        <rect x="2.5" y="13" width="4.5" height="7" rx="2.2"/><rect x="17" y="13" width="4.5" height="7" rx="2.2"/>
      </svg>
      <span class="nav-label hidden text-[14px] font-semibold">Dinle</span>
    </button>
    <button data-nav="saved" class="nav-btn flex items-center gap-2 rounded-full px-4 py-3 transition" aria-label="Kaydedilenler">
      <svg class="h-[22px] w-[22px] shrink-0" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24">
        <path d="M7 4h10a1 1 0 0 1 1 1v15l-6-4-6 4V5a1 1 0 0 1 1-1z" stroke-linejoin="round"/>
      </svg>
      <span class="nav-label hidden text-[14px] font-semibold">Kayıtlı</span>
    </button>
  </div>
</nav>

<audio id="player" preload="none" class="hidden"></audio>
<script src="app.js"></script>
</body>
</html>
